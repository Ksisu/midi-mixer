; USB MIDI DJ mixer controller - Wemos ESP32-S2 Mini
[platformio]
default_envs = lolin_s2_mini

[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino

lib_deps =
    adafruit/Adafruit TinyUSB Library @ ^3.1.0
    fortyseveneffects/MIDI Library @ ^5.0.2

build_flags =
    -DUSE_TINYUSB
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200

; Flashing a board that is ALREADY in bootloader mode (hold 0, tap RST, release 0).
; esptool's default reset toggles DTR/RTS, which on the S2's native USB kicks the
; ROM bootloader straight back out of download mode - so suppress both resets.
; Usage: pio run -e lolin_s2_mini_manual -t upload
[env:lolin_s2_mini_manual]
extends = env:lolin_s2_mini
upload_flags =
    --before
    no_reset
    --after
    no_reset
